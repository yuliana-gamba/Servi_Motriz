<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de Vehículo - ServiMotriz</title>

<link rel="stylesheet" href="vehiculo.css">

</head>

<body>

<div class="contenedor">


<h2>Vehículo</h2>

<form>

<label for="placa">Placa</label>
<input type="text" id="placa" placeholder="Ingrese la placa del vehículo" required>

<label for="modelo">Modelo</label>
<input type="text" id="modelo" placeholder="Ingrese el modelo" required>

<label for="color">Color</label>
<input type="text" id="color" placeholder="Ingrese el color">

<label for="fecha-registro">Fecha de Registro</label>
<input type="date" id="fecha-registro" required>

<label for="marca">Marca</label>
<select id="marca" required>
<option value="" disabled selected>Seleccione una marca</option>
<option value="toyota">Toyota</option>
<option value="chevrolet">Chevrolet</option>
<option value="mazda">Mazda</option>
<option value="nissan">Nissan</option>
<option value="ford">Ford</option>
</select>

<label for="propietario">Propietario</label>
<input type="text" id="propietario" placeholder="Ingrese el nombre del propietario" required>

<button type="submit" class="boton">
Registrar Vehículo
</button>

</form>

</div>

</body>
</html>
