<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tipo de Identificación - ServiMotriz</title>

<link rel="stylesheet" href="tipoDeIdentificacion.css">

</head>

<body>

<div class="contenedor">

<h2>Tipo de Identificación</h2>

<form>

<label for="tipo-identificacion">Tipo de Identificación</label>
<select id="tipo-identificacion" required>
<option value="" disabled selected>Seleccione un tipo de identificación</option>
<option value="cc">Cédula de Ciudadanía</option>
<option value="ce">Cédula de Extranjería</option>
<option value="nit">NIT</option>
<option value="pasaporte">Pasaporte</option>
<option value="ti">Tarjeta de Identidad</option>
</select>

<button type="submit" class="boton">
Registrar Tipo
</button>

</form>

</div>

</body>
</html>
